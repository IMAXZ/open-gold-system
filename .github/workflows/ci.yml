name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test

  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore .\GoldCollector.DotNet.slnx --configfile ..\..\NuGet.Config
      - run: dotnet build .\GoldCollector.DotNet.slnx -c Release --no-restore
      - run: dotnet test .\GoldCollector.DotNet.slnx -c Release --no-build
