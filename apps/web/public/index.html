<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
    <link rel="icon" type="image/svg+xml" href="<%= BASE_URL %>logo.svg">
    <title>黄金价格看板</title>
    <script>
      window.APP_CONFIG = { apiUrl: '' };

      try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '<%= BASE_URL %>config.json', false);
        xhr.send();

        if (xhr.status === 200) {
          window.APP_CONFIG = JSON.parse(xhr.responseText);
        }
      } catch (e) {
        console.log('未找到 config.json，将使用默认配置');
      }
    </script>
  </head>
  <body>
    <noscript>
      <strong>当前页面依赖 JavaScript，请启用后继续访问。</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
