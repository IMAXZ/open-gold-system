spring:
  datasource:
    url: ${GOLD_DB_URL:jdbc:mysql://localhost:3306/assets?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${GOLD_DB_USERNAME:root}
    password: ${GOLD_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

# 定时任务配置
gold:
  enabled: true
  api:
    url: https://api.gold-api.com/
    timeout: 5000
  schedule:
    cron: "0 */1 * * * *"
  exchange-rate:
    default: 7.25

# 应用配置
server:
  port: 41736

# 跨域配置
cors:
  enabled: true
  allowed-origin-patterns: "*"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
  allow-credentials: true
  allowed-headers: "*"
  exposed-headers: "*"
  max-age: 3600
