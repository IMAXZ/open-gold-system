spring:
  datasource:
    url: ${GOLD_DB_URL:jdbc:mysql://localhost:3306/assets?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${GOLD_DB_USERNAME:root}
    password: ${GOLD_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

gold:
  enabled: true
  api:
    url: https://api.gold-api.com/
    timeout: 5000
  schedule:
    cron: "0 */1 * * * *"
  exchange-rate:
    default: 7.25

server:
  port: 41736

cors:
  enabled: true
  allowed-origin-patterns: "*"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
  allow-credentials: true
  allowed-headers: "*"
  exposed-headers: "*"
  max-age: 3600
